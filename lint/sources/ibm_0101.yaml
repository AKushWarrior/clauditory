  page: 195
  entry: "Units of time"
  kind: substitution
  wrong: "secs"
  right: "seconds"
  domain: wording
  fix: review
  american: true
  context: technical documentation
  note: Spell out seconds in text; abbreviation is sec. or SI s.
- source: ibm
  page: 195
  entry: "Units of time"
  kind: substitution
  wrong: "hrs"
  right: "hours"
  domain: wording
  fix: review
  american: true
  context: technical documentation
  note: Spell out hours in text; abbreviation is hr. with a period.
- source: ibm
  page: 195
  entry: "Units of time"
  kind: substitution
  wrong: "yrs"
  right: "years"
  domain: wording
  fix: review
  american: true
  context: technical documentation
  note: Spell out years in text; abbreviation is yr. with a period.
- source: ibm
  page: 195
  entry: "Units of time"
  kind: substitution
  wrong: "msecs"
  right: "ms"
  domain: wording
  fix: review
  american: true
  context: technical documentation
  note: Use ms for milliseconds, with a space after the number (23 ms).
- source: ibm
  page: 195
  entry: "Feet and inches"
  kind: existence
  wrong: "\\d+'\\d{1,2}(?=\")"
  domain: grammar
  fix: none
  american: true
  context: technical documentation
  note: Do not use quotation marks for feet and inches; write ft and in. or spell out.
- source: ibm
  page: 196
  entry: "Temperatures"
  kind: existence
  wrong: "\\d+\\s°|°\\s[CF]"
  domain: grammar
  fix: review
  american: true
  context: technical documentation
  note: No space before or after the degree symbol (100°C).
- source: ibm
  page: 196
  entry: "Tolerances"
  kind: existence
  wrong: "\\d\\s±|\\d±\\s\\d"
  domain: grammar
  fix: review
  american: true
  context: technical documentation
  note: Place the plus-or-minus sign next to the tolerance with no spaces (50±5 V).

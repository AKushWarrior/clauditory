extends: existence
message: "Remove the space before the punctuation mark."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/oxford-new-harts-rules.md
level: warning
nonword: true
action:
  name: edit
  params:
    - regex
    - '\s+([,.;:?!])'
    - '$1'
tokens:
  - '(?<=\w) +[,;:?!](?=\s|$)'
  - '(?<=[a-z]) +\.(?=\s|$)'

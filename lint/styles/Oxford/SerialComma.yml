extends: existence
message: "Add the serial comma before the final 'and' or 'or' in '%s'."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/oxford-new-harts-rules.md
level: warning
nonword: true
action:
  name: edit
  params:
    - regex
    - '(\w) (and|or) (\S+)$'
    - '$1, $2 $3'
tokens:
  - '(?<![\w,] )(?:\b[\w-]+, ){2,6}[\w-]+ (?:and|or) [\w-]+'
  - '\b[\w-]+, [\w-]+ (?:and|or) [\w-]+(?=[.?!;:)]|$)'

extends: existence
message: "In American text, put the period or comma inside the closing quotation mark."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/oxford-new-harts-rules.md
level: warning
nonword: true
action:
  name: edit
  params:
    - regex
    - '(["”])([.,])$'
    - '$2$1'
tokens:
  - '(?<=\w)["”][.,]'

extends: substitution
message: "Write '%s', not '%s'."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/chicago-manual-of-style.md
level: warning
ignorecase: true
action:
  name: replace
swap:
  irregardless: regardless
  could care less: couldn't care less
  orientate: orient
  orientated: oriented
  preventative: preventive
  supposably: supposedly
  alot: a lot
  based off of: based on
  based off: based on
  off of: off
  try and: try to
  very unique: unique
  most unique: unique
  in the near future: soon

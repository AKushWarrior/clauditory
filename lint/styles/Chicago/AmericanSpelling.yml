  analysed: analyzed
  organise: organize
  organised: organized
  organisation: organization
  organisations: organizations
  recognise: recognize
  recognised: recognized
  optimise: optimize
  optimised: optimized
  prioritise: prioritize
  summarise: summarize
  initialise: initialize
  initialised: initialized
  serialise: serialize
  licence: license
  defence: defense
  offence: offense
  travelled: traveled
  travelling: traveling
  cancelled: canceled

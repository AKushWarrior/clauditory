extends: existence
message: "Don't use a dash, or hyphens standing in for one ('%s'). Use a comma, colon, parentheses, or a period, and write ranges with 'to'. Put a command-line flag in code formatting."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/SKILL.md#10-revision-pass
level: error
nonword: true
tokens:
  # The em dash, horizontal bar, figure dash, and en dash, spaced or not.
  - '\s*[—―‒–]\s*'
  # Two or more hyphens, spaced or not: word--word, word -- word, word---word.
  - '(?<=\w)\s*-{2,}\s*(?=\w)'
  # Two or more hyphens trailing a word at the end of a clause.
  - '(?<=\w)\s*-{2,}(?=\s|$)'
  # A single hyphen with a space on either side: word - word, word -word.
  - '(?<=\w) +-+ +(?=\w)'
  - '(?<=[A-Za-z]) -(?=[A-Za-z])(?!(?:ly|ise|ize|yse|yze|or|our|er|re|ed|ing|s|es|ment|ness|ful|less|able|ible|ish|ism|ist|ity|ive|ous|al|ic|y|wise|like|free)\b)'
  # A hyphen closed up on the left and spaced on the right, unless it is a
  # suspended hyphen (pre- and post-war).
  - '(?<=[A-Za-z])- (?!(?:and|or|to|nor|through)\b)(?=\w)'

extends: existence
message: "Use a comma in numbers of four or more digits, except years, versions, and code: '%s'."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/nyt-manual-of-style.md
level: suggestion
nonword: true
tokens:
  - '(?<![\w.,$:#/v-])\d{5,}(?![\w.,%/:-])'
  - '(?<![\w.,$:#/v-])\d{4}(?= (?:people|users|files|lines|words|pages|tokens|requests|calls|rows|items|dollars|miles|kilometers|participants|responses|tests|runs)\b)'

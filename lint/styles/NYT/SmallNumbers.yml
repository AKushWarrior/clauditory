extends: existence
message: "Spell out numbers one through nine, unless '%s' is a measurement, money, an age, a percentage, or data."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/nyt-manual-of-style.md
level: suggestion
nonword: true
tokens:
  - '(?<![\w.,$/:#-])[1-9] (?=(?:people|persons|users|files|steps|reasons|items|ways|options|sources|agents|models|examples|rules|sections|chapters|words|pages|paragraphs|lines|commits|questions|answers|issues|cases|tests|teams|companies|countries|groups|parts|times|things|points|days|weeks|months|years)\b)'

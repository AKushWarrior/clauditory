extends: existence
message: "Don't put a comma before Jr. or Sr.: '%s'."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/ap-stylebook.md
level: suggestion
nonword: true
action:
  name: edit
  params:
    - regex
    - ', (Jr|Sr)\.'
    - ' $1.'
tokens:
  - '(?<=[A-Z][a-z]+), (?:Jr|Sr)\.'

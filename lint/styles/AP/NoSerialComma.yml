extends: existence
message: "AP omits the comma before the final 'and' or 'or' in a simple series: '%s'."
link: https://github.com/AKushWarrior/clauditory/blob/main/chat/skills/writing-style/references/ap-stylebook.md
level: suggestion
nonword: true
tokens:
  - '(?:\b[\w-]+, ){2,6}[\w-]+, (?:and|or) [\w-]+(?=[.?!;:)]|$)'
